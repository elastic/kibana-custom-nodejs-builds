env:
  # Remove a version here when Kibana no longer needs its custom builds.
  SUPPORTED_NODE_VERSIONS: "24.22.2 26.13.0"

steps:
  - label: Generate supported Node.js builds
    command: scripts/upload_pipeline.sh
    agents:
      image: family/kibana-ubuntu-2404
      provider: gcp
      machineType: n2-standard-2
